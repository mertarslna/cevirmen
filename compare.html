<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT Karşılaştırma & Zaman Damgası Kontrolü</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="srtlogo.png" type="image/png">
    <script src="storage.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 h-screen overflow-hidden flex flex-col font-sans">

    <!-- Header -->
    <header
        class="sticky top-0 z-50 bg-slate-800/90 backdrop-blur-md border-b border-slate-700 py-3 px-5 shadow-lg flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-3">
            <button id="sidebar-toggle" onclick="toggleSidebar()" title="Dosya panelini aç/kapat"
                class="p-2 rounded-lg hover:bg-slate-700 transition text-slate-400 hover:text-slate-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <a href="index.html"
                class="p-2 rounded-lg bg-slate-700/60 hover:bg-slate-700 transition text-slate-300 hover:text-white flex items-center gap-1.5 text-xs font-medium border border-slate-600/50 ml-2"
                title="Editöre Dön">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Editöre Dön
            </a>
        </div>
        <div id="stats-summary" class="hidden flex items-center gap-3 text-xs">
            <span class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300">Orijinal: <strong
                    id="orig-count" class="text-indigo-400">0</strong></span>
            <span class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300">Çeviri: <strong
                    id="trans-count" class="text-indigo-400">0</strong></span>
            <span id="issue-badge-summary"
                class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300">Sorunlu Blok: <strong
                    id="issue-count" class="text-emerald-400">0</strong></span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">

        <!-- Sidebar -->
        <aside id="file-sidebar" style="width: 22rem;"
            class="shrink-0 bg-slate-800/60 border-r border-slate-700 flex flex-col overflow-hidden">
            <div class="p-3 border-b border-slate-700 flex flex-col gap-2">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Dosyalar</p>
                <div class="flex gap-2">
                    <input type="file" id="srt-files-input" accept=".srt" multiple class="hidden"
                        onchange="handleFilesFromInput(event)">
                    <input type="file" id="srt-folder-input" webkitdirectory class="hidden"
                        onchange="handleFilesFromInput(event)">
                    <button onclick="document.getElementById('srt-files-input').click()"
                        class="flex-1 bg-slate-700 hover:bg-indigo-600 text-slate-200 hover:text-white text-xs px-2 py-1.5 rounded transition flex items-center justify-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Dosya Ekle
                    </button>
                    <button onclick="document.getElementById('srt-folder-input').click()"
                        class="flex-1 bg-slate-700 hover:bg-indigo-600 text-slate-200 hover:text-white text-xs px-2 py-1.5 rounded transition flex items-center justify-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />
                        </svg>
                        Klasör Ekle
                    </button>
                </div>
            </div>
            <div id="file-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <p class="text-xs text-slate-500 text-center mt-6 px-2">Dosyalarınızı sürükleyin veya yukarıdan ekleyin.
                </p>
            </div>
            <div class="p-2 border-t border-slate-700 flex justify-between items-center text-xs px-3">
                <p id="file-count" class="text-slate-500"></p>
                <button onclick="clearAllDataPrompt()"
                    class="text-slate-500 hover:text-red-400 transition underline underline-offset-2"
                    title="Tüm yüklü dosyaları ve verileri sıfırla">Temizle</button>
            </div>
        </aside>

        <!-- Sidebar Resizer Handle -->
        <div id="sidebar-resizer"
            class="w-1.5 cursor-col-resize hover:bg-indigo-500/50 active:bg-indigo-600 transition-colors z-10 shrink-0 border-r border-slate-700/50 bg-slate-800">
        </div>
        <script>
            (function () {
                const savedWidth = localStorage.getItem('sidebarWidth') || '22rem';
                const isOpen = localStorage.getItem('sidebarOpen') !== 'false';
                const sb = document.getElementById('file-sidebar');
                const resizer = document.getElementById('sidebar-resizer');
                if (sb && resizer) {
                    if (!isOpen) {
                        sb.style.width = '0';
                        sb.style.opacity = '0';
                        resizer.style.display = 'none';
                    } else {
                        sb.style.width = savedWidth;
                    }
                }
            })();
        </script>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-6 flex flex-col relative" id="main-dropzone"
            ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">

            <div id="drop-overlay"
                class="absolute inset-0 bg-indigo-500/10 border-4 border-dashed border-indigo-500/50 rounded-2xl m-4 z-10 hidden flex-col justify-center items-center backdrop-blur-sm transition-all pointer-events-none">
                <svg class="w-16 h-16 text-indigo-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="text-xl font-bold text-indigo-300">Dosyaları Buraya Bırakın</p>
            </div>

            <!-- Selection Summary -->
            <div id="selection-summary"
                class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl mb-6 flex flex-wrap items-center gap-4 justify-between shadow-sm shrink-0">
                <div
                    class="flex-1 min-w-[240px] w-full bg-indigo-950/30 border border-indigo-900/50 rounded-lg p-3 flex flex-col">
                    <div class="flex items-center gap-1.5 mb-1 text-indigo-400">
                        <span class="bg-indigo-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">O</span>
                        <p class="text-xs font-semibold">Orijinal (Kaynak) Dosya</p>
                    </div>
                    <p id="summary-orig-name" class="text-sm text-slate-300 truncate font-mono">Seçilmedi</p>
                </div>
                <div
                    class="flex-1 min-w-[240px] w-full bg-violet-950/30 border border-violet-900/50 rounded-lg p-3 flex flex-col">
                    <div class="flex items-center gap-1.5 mb-1 text-violet-400">
                        <span class="bg-violet-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">Ç</span>
                        <p class="text-xs font-semibold">Çeviri (Hedef) Dosya</p>
                    </div>
                    <p id="summary-trans-name" class="text-sm text-slate-300 truncate font-mono">Seçilmedi</p>
                </div>
                <div class="shrink-0 pt-2 md:pt-0">
                    <button id="btn-compare" onclick="checkAndRenderComparison()" disabled
                        class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-500 disabled:border-slate-700 border border-indigo-500/30 text-white font-semibold px-6 py-3 rounded-xl shadow-lg transition-all flex items-center gap-2 text-sm disabled:cursor-not-allowed h-full">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2m0 10V7" />
                        </svg>
                        Karşılaştır
                    </button>
                </div>
            </div>

            <!-- Comparison Dashboard -->
            <div id="comparison-dashboard" class="hidden flex-col gap-4">
                <div id="block-mismatch-banner"
                    class="hidden bg-amber-950/40 border border-amber-800/80 rounded-xl p-4 flex items-center gap-3 text-amber-200 shrink-0">
                    <svg class="w-6 h-6 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <div>
                        <p class="font-semibold text-amber-300 text-sm">Blok Sayısı Uyuşmazlığı Tespit Edildi!</p>
                        <p id="block-mismatch-text" class="text-xs text-amber-200/80 mt-0.5"></p>
                    </div>
                </div>

                <div
                    class="flex flex-wrap items-center justify-between gap-3 bg-slate-800 p-3 rounded-xl border border-slate-700 shrink-0">
                    <div class="flex items-center gap-2 bg-slate-900 p-1 rounded-lg border border-slate-700/80">
                        <button id="tab-all" onclick="setFilter('all')"
                            class="px-3 py-1.5 rounded-md text-xs font-medium transition bg-indigo-600 text-white shadow">Tüm
                            Altyazılar (<span id="count-all">0</span>)</button>
                        <button id="tab-issues" onclick="setFilter('issues')"
                            class="px-3 py-1.5 rounded-md text-xs font-medium transition text-slate-400 hover:text-slate-200">⚠️
                            Sadece Sorunlu Çeviriler (<span id="count-issues">0</span>)</button>
                    </div>
                    <div class="relative">
                        <input type="text" id="search-input" oninput="renderComparisonList()"
                            placeholder="Metin veya blok ara..."
                            class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 w-48 pl-8">
                        <svg class="w-4 h-4 text-slate-500 absolute left-2.5 top-2" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                </div>

                <div id="comparison-list" class="space-y-4"></div>
            </div>

        </main>
    </div>

    <script>
        let fileStore = {};
        let collapsedFolders = new Set();
        let sidebarOpen = localStorage.getItem('sidebarOpen') !== 'false';

        let origFileKey = null;
        let transFileKey = null;
        let origBlocks = [];
        let transBlocks = [];
        let activeFilter = 'all';
        let comparisonActive = false;

        // ── SIDEBAR & UI ──────────────────────────────────────────────────
        let currentSidebarWidth = localStorage.getItem('sidebarWidth') || '22rem';

        function toggleSidebar() {
            const sb = document.getElementById('file-sidebar');
            const resizer = document.getElementById('sidebar-resizer');

            // Re-enable transition just for the toggle animation
            sb.style.transition = 'width 0.3s ease, opacity 0.3s ease';

            sidebarOpen = !sidebarOpen;
            localStorage.setItem('sidebarOpen', sidebarOpen);

            if (sidebarOpen) {
                sb.style.width = currentSidebarWidth;
                sb.style.opacity = '1';
                resizer.style.display = 'block';
            } else {
                currentSidebarWidth = sb.style.width || '22rem';
                sb.style.width = '0';
                sb.style.opacity = '0';
                resizer.style.display = 'none';
            }

            // Clean up transition after animation so resize is instant
            setTimeout(() => {
                sb.style.transition = '';
            }, 300);
        }

        // ── SIDEBAR RESIZE LOGIC ──────────────────────────────────────────
        const resizer = document.getElementById('sidebar-resizer');
        const sidebar = document.getElementById('file-sidebar');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            document.body.classList.add('select-none'); // Prevent text selection
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            // Calculate new width (mouse X position minus sidebar's starting X)
            const sidebarRect = sidebar.getBoundingClientRect();
            let newWidth = e.clientX - sidebarRect.left;

            // Set constraints
            if (newWidth < 150) newWidth = 150;
            if (newWidth > 600) newWidth = 600;

            sidebar.style.width = newWidth + 'px';
            currentSidebarWidth = newWidth + 'px';
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.classList.remove('select-none');
                localStorage.setItem('sidebarWidth', currentSidebarWidth);
            }
        });

        function handleDragOver(e) {
            e.preventDefault();
            document.getElementById('drop-overlay').classList.remove('hidden');
            document.getElementById('drop-overlay').classList.add('flex');
        }
        function handleDragLeave(e) {
            e.preventDefault();
            document.getElementById('drop-overlay').classList.add('hidden');
            document.getElementById('drop-overlay').classList.remove('flex');
        }

        async function handleDrop(e) {
            e.preventDefault();
            document.getElementById('drop-overlay').classList.add('hidden');
            document.getElementById('drop-overlay').classList.remove('flex');

            const items = e.dataTransfer.items;
            const fileObjs = [];

            if (items && items.length > 0 && items[0].webkitGetAsEntry) {
                const entries = [];
                for (let i = 0; i < items.length; i++) {
                    const entry = items[i].webkitGetAsEntry();
                    if (entry) entries.push(entry);
                }
                await readEntriesRecursively(entries, fileObjs);
                if (fileObjs.length) loadFilesWithPaths(fileObjs);
            } else {
                const rawFiles = [...e.dataTransfer.files].filter(f => f.name.endsWith('.srt'));
                if (rawFiles.length) {
                    loadFilesWithPaths(rawFiles.map(f => ({ file: f, path: f.webkitRelativePath || f.name })));
                }
            }
        }

        function handleFilesFromInput(event) {
            const rawFiles = [...event.target.files].filter(f => f.name.endsWith('.srt'));
            if (!rawFiles.length) return;
            const fileObjs = rawFiles.map(f => ({ file: f, path: f.webkitRelativePath || f.name }));
            loadFilesWithPaths(fileObjs);
            event.target.value = '';
        }

        async function readEntriesRecursively(entries, fileObjs) {
            for (const entry of entries) {
                if (entry.isFile && entry.name.endsWith('.srt')) {
                    await new Promise((resolve) => {
                        entry.file(f => {
                            const relPath = entry.fullPath.startsWith('/') ? entry.fullPath.substring(1) : entry.fullPath;
                            fileObjs.push({ file: f, path: relPath });
                            resolve();
                        });
                    });
                } else if (entry.isDirectory) {
                    const dirReader = entry.createReader();
                    const childEntries = await readAllDirectoryEntries(dirReader);
                    await readEntriesRecursively(childEntries, fileObjs);
                }
            }
        }
        function readAllDirectoryEntries(dirReader) {
            return new Promise((resolve) => {
                let entries = [];
                function readBatch() {
                    dirReader.readEntries((results) => {
                        if (!results.length) resolve(entries);
                        else { entries = entries.concat(Array.from(results)); readBatch(); }
                    }, () => resolve(entries));
                }
                readBatch();
            });
        }

        function loadFilesWithPaths(fileObjs) {
            let loaded = 0;
            fileObjs.forEach(({ file, path }) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    if (!fileStore[path]) {
                        // Store in the same format as index.html (subtitles array + raw content)
                        fileStore[path] = {
                            path,
                            name: file.name,
                            content: e.target.result,
                            subtitles: parseSubtitlesForEditor(e.target.result)
                        };
                    }
                    loaded++;
                    if (loaded === fileObjs.length) {
                        renderFileList();
                        saveSharedFileStore();
                        saveCompareState();
                    }
                };
                reader.readAsText(file, 'UTF-8');
            });
        }

        // Parse subtitles in editor format (for shared storage compatibility)
        function parseSubtitlesForEditor(data) {
            const clean = data.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const blocks = clean.trim().split(/\n\s*\n/);
            const subs = [];
            blocks.forEach(block => {
                const lines = block.split('\n');
                if (lines.length >= 3) {
                    subs.push({ index: subs.length + 1, time: lines[1].trim(), text: lines.slice(2).join('\n'), suggestion: '' });
                }
            });
            return subs;
        }

        // ── FILE TREE RENDERING ───────────────────────────────────────────
        function buildFileTree() {
            const root = { name: '', fullPath: '', type: 'folder', children: {} };
            Object.keys(fileStore).forEach(key => {
                const entry = fileStore[key];
                const parts = key.split('/');
                let current = root;
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    const isFile = (i === parts.length - 1);
                    const currentPath = current.fullPath ? current.fullPath + '/' + part : part;

                    if (isFile) {
                        current.children[part] = {
                            name: part,
                            fullPath: key,
                            type: 'file',
                            key: key,
                            subtitlesCount: entry.subtitles ? entry.subtitles.length : 0
                        };
                    } else {
                        if (!current.children[part]) {
                            current.children[part] = { name: part, fullPath: currentPath, type: 'folder', children: {} };
                        }
                        current = current.children[part];
                    }
                }
            });
            return root;
        }

        function sortTree(node) {
            if (node.type !== 'folder' || !node.children) return [];
            const keys = Object.keys(node.children);
            const list = keys.map(k => {
                const child = node.children[k];
                if (child.type === 'folder') child.sortedChildren = sortTree(child);
                return child;
            });
            list.sort((a, b) => {
                if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
                return a.name.localeCompare(b.name, 'tr', { numeric: true, sensitivity: 'base' });
            });
            return list;
        }

        function renderFileList() {
            const list = document.getElementById('file-list');
            const countEl = document.getElementById('file-count');
            list.innerHTML = '';

            const keys = Object.keys(fileStore);
            if (keys.length === 0) {
                list.innerHTML = '<p id="no-files-msg" class="text-xs text-slate-500 text-center mt-6 px-2">Henüz dosya yüklenmedi.<br>Yukarıdaki butonları kullanın.</p>';
                countEl.textContent = '';
                return;
            }
            countEl.textContent = keys.length + ' dosya yüklü';

            const rootTree = buildFileTree();
            const sortedNodes = sortTree(rootTree);
            const container = document.createElement('div');
            container.className = 'flex gap-2 items-start';

            const col1 = document.createElement('div');
            col1.className = 'flex-1 flex flex-col space-y-1 min-w-0';

            const col2 = document.createElement('div');
            col2.className = 'flex-1 flex flex-col space-y-1 min-w-0';

            container.appendChild(col1);
            container.appendChild(col2);

            sortedNodes.forEach((node, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col space-y-1';
                // If it's a file at root, it will also be inside a col, which is fine.
                renderNode(node, wrapper, 0);

                if (index % 2 === 0) {
                    col1.appendChild(wrapper);
                } else {
                    col2.appendChild(wrapper);
                }
            });
            list.appendChild(container);
        }

        function renderNode(node, parentEl, depth) {
            const indentPx = depth > 0 ? (depth * 10 + 4) : 4;

            if (node.type === 'folder') {
                const isCollapsed = collapsedFolders.has(node.fullPath);
                const folderItem = document.createElement('div');
                folderItem.className = 'file-item border border-slate-700/40 hover:border-slate-600 rounded-lg px-2 py-1.5 cursor-pointer flex items-center gap-1.5 text-slate-300 hover:text-slate-100 select-none bg-slate-800/40';
                folderItem.style.paddingLeft = indentPx + 'px';

                const chevronSvg = isCollapsed
                    ? '<svg class="w-3.5 h-3.5 text-slate-500 shrink-0 transform -rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>'
                    : '<svg class="w-3.5 h-3.5 text-slate-400 shrink-0 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>';
                const folderIconSvg = isCollapsed
                    ? '<svg class="w-4 h-4 text-amber-500/80 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>'
                    : '<svg class="w-4 h-4 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"/></svg>';

                folderItem.innerHTML = chevronSvg + folderIconSvg +
                    '<span class="text-xs font-semibold truncate flex-1" title="' + node.name + '">' + node.name + '</span>' +
                    '<button class="del-btn text-slate-600 hover:text-red-400 shrink-0 p-0.5" title="Kaldır">' +
                    '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>';

                folderItem.addEventListener('click', () => {
                    if (collapsedFolders.has(node.fullPath)) collapsedFolders.delete(node.fullPath);
                    else collapsedFolders.add(node.fullPath);
                    renderFileList();
                    saveState();
                });
                folderItem.querySelector('.del-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm('Klasörü kaldırmak istediğinize emin misiniz?')) {
                        const prefix = node.fullPath + '/';
                        Object.keys(fileStore).filter(k => k === node.fullPath || k.startsWith(prefix)).forEach(k => delete fileStore[k]);
                        checkSelections();
                        renderFileList();
                        saveState();
                    }
                });
                parentEl.appendChild(folderItem);

                if (!isCollapsed && node.sortedChildren) {
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'space-y-1 mt-0.5';
                    node.sortedChildren.forEach(child => renderNode(child, childrenContainer, depth + 1));
                    parentEl.appendChild(childrenContainer);
                }
            } else {
                const isOrig = node.key === origFileKey;
                const isTrans = node.key === transFileKey;

                const fileItem = document.createElement('div');
                let extraClasses = '';
                if (isOrig) extraClasses = 'active-orig';
                else if (isTrans) extraClasses = 'active-trans';

                fileItem.className = 'file-item border border-slate-700/60 rounded-lg px-2 py-1.5 cursor-pointer flex items-center gap-1.5 group ' + extraClasses;
                fileItem.style.paddingLeft = indentPx + 'px';

                const iconColor = isOrig ? 'text-indigo-400' : (isTrans ? 'text-violet-400' : 'text-slate-500');
                const nameColor = isOrig ? 'text-indigo-300 font-semibold' : (isTrans ? 'text-violet-300 font-semibold' : 'text-slate-300');

                fileItem.innerHTML =
                    '<div class="flex-1 min-w-0 relative flex items-center gap-1.5 h-full">' +
                    '<svg class="w-4 h-4 shrink-0 ' + iconColor + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>' +
                    '<span class="text-xs truncate w-full ' + nameColor + '" title="' + node.fullPath + '">' + node.name + '</span>' +
                    '<span class="text-xs text-slate-500 shrink-0">' + (node.subtitlesCount !== undefined ? node.subtitlesCount : '') + '</span>' +
                    '<div class="absolute inset-0 -mx-1 px-1 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1.5 bg-slate-800/80 backdrop-blur-sm z-10">' +
                    '<button class="bg-indigo-900/80 hover:bg-indigo-600 text-indigo-300 hover:text-white px-2 py-0.5 rounded text-[10px] font-medium border border-indigo-700/50" title="Orijinal (Kaynak) dosya olarak seç" data-action="set-orig">Orijinal</button>' +
                    '<button class="bg-violet-900/80 hover:bg-violet-600 text-violet-300 hover:text-white px-2 py-0.5 rounded text-[10px] font-medium border border-violet-700/50" title="Çeviri (Hedef) dosya olarak seç" data-action="set-trans">Hedef</button>' +
                    '</div>' +
                    '</div>' +
                    '<button class="del-btn relative z-20 text-slate-600 hover:text-red-400 shrink-0 p-0.5 ml-0.5 rounded" title="Kaldır" data-action="del"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>';

                fileItem.querySelector('[data-action="set-orig"]').addEventListener('click', (e) => { e.stopPropagation(); setOriginal(node.key); });
                fileItem.querySelector('[data-action="set-trans"]').addEventListener('click', (e) => { e.stopPropagation(); setTranslated(node.key); });
                fileItem.querySelector('[data-action="del"]').addEventListener('click', (e) => {
                    e.stopPropagation();
                    delete fileStore[node.key];
                    checkSelections();
                    renderFileList();
                    saveSharedFileStore();
                    saveCompareState();
                });
                parentEl.appendChild(fileItem);
            }
        }

        // ── SELECTION LOGIC ───────────────────────────────────────────────
        function getFileContent(key) {
            const file = fileStore[key];
            if (file.content) return file.content;
            // Reconstruct from subtitles if content is missing
            if (file.subtitles && file.subtitles.length > 0) {
                return file.subtitles.map((s, i) => `${i + 1}\n${s.time}\n${s.text}`).join('\n\n');
            }
            return '';
        }

        function setOriginal(key) {
            if (key === transFileKey) {
                alert('Bu dosya zaten Çeviri (Hedef) dosyası olarak seçili. Aynı dosyayı her iki tarafa da seçemezsiniz.');
                return;
            }
            origFileKey = key;
            const file = fileStore[key];
            origBlocks = parseSRT(getFileContent(key));
            document.getElementById('summary-orig-name').textContent = file.path;

            comparisonActive = false;
            document.getElementById('comparison-dashboard').classList.add('hidden');
            document.getElementById('comparison-dashboard').classList.remove('flex');

            updateCompareBtn();
            renderFileList();
            saveCompareState();
        }

        function setTranslated(key) {
            if (key === origFileKey) {
                alert('Bu dosya zaten Orijinal (Kaynak) dosyası olarak seçili. Aynı dosyayı her iki tarafa da seçemezsiniz.');
                return;
            }
            transFileKey = key;
            const file = fileStore[key];
            transBlocks = parseSRT(getFileContent(key));
            document.getElementById('summary-trans-name').textContent = file.path;

            comparisonActive = false;
            document.getElementById('comparison-dashboard').classList.add('hidden');
            document.getElementById('comparison-dashboard').classList.remove('flex');

            updateCompareBtn();
            renderFileList();
            saveState();
        }

        function checkSelections() {
            if (origFileKey && !fileStore[origFileKey]) { origFileKey = null; origBlocks = []; document.getElementById('summary-orig-name').textContent = 'Seçilmedi'; }
            if (transFileKey && !fileStore[transFileKey]) { transFileKey = null; transBlocks = []; document.getElementById('summary-trans-name').textContent = 'Seçilmedi'; }
            updateCompareBtn();
        }

        function updateCompareBtn() {
            const btn = document.getElementById('btn-compare');
            btn.disabled = !(origFileKey && transFileKey);
        }

        async function clearAllDataPrompt() {
            if (confirm('Yüklenen tüm dosyalar silinecektir. Emin misiniz? (Bu işlem editördeki dosyaları da kaldıracaktır.)')) {
                fileStore = {};
                origFileKey = null;
                transFileKey = null;
                origBlocks = [];
                transBlocks = [];
                document.getElementById('summary-orig-name').textContent = 'Seçilmedi';
                document.getElementById('summary-trans-name').textContent = 'Seçilmedi';
                document.getElementById('comparison-dashboard').classList.add('hidden');
                document.getElementById('comparison-dashboard').classList.remove('flex');
                document.getElementById('stats-summary').classList.add('hidden');
                updateCompareBtn();
                renderFileList();
                await saveSharedFileStore();
                await saveCompareState();
            }
        }

        // ── PARSER ────────────────────────────────────────────────────────
        function parseSRT(data) {
            const clean = data.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const blocks = clean.trim().split(/\n\s*\n/);
            const subs = [];
            blocks.forEach((block, idx) => {
                const lines = block.split('\n');
                if (lines.length >= 3) {
                    const timeLine = lines[1].trim();
                    const text = lines.slice(2).join('\n');
                    const parsedTime = parseTimeRange(timeLine);
                    subs.push({
                        index: idx + 1,
                        rawTime: timeLine,
                        text: text,
                        startMs: parsedTime.startMs,
                        endMs: parsedTime.endMs,
                        timeValid: parsedTime.valid,
                        timeError: parsedTime.error
                    });
                }
            });
            return subs;
        }

        function parseTimeRange(timeStr) {
            const parts = timeStr.split('-->').map(s => s.trim());
            if (parts.length !== 2) return { valid: false, error: 'Format hatası: "-->" bulunamadı' };
            const startMs = parseSingleTimestamp(parts[0]);
            const endMs = parseSingleTimestamp(parts[1]);
            if (startMs === null || endMs === null) return { valid: false, error: 'Geçersiz format' };
            if (startMs > endMs) return { valid: false, error: 'Başlangıç bitişten sonra' };
            return { valid: true, startMs, endMs, error: null };
        }
        function parseSingleTimestamp(ts) {
            const m = ts.trim().match(/^(\d{2}):(\d{2}):(\d{2})[.,](\d{3})$/);
            if (!m) return null;
            return parseInt(m[1], 10) * 3600000 + parseInt(m[2], 10) * 60000 + parseInt(m[3], 10) * 1000 + parseInt(m[4], 10);
        }

        // ── COMPARISON ENGINE ─────────────────────────────────────────────
        function checkAndRenderComparison() {
            if (!origBlocks.length || !transBlocks.length) return;

            comparisonActive = true;
            document.getElementById('comparison-dashboard').classList.remove('hidden');
            document.getElementById('comparison-dashboard').classList.add('flex');
            document.getElementById('stats-summary').classList.remove('hidden');
            document.getElementById('stats-summary').classList.add('flex');

            document.getElementById('orig-count').textContent = origBlocks.length;
            document.getElementById('trans-count').textContent = transBlocks.length;

            const banner = document.getElementById('block-mismatch-banner');
            if (origBlocks.length !== transBlocks.length) {
                banner.classList.remove('hidden');
                banner.classList.add('flex');
                document.getElementById('block-mismatch-text').textContent =
                    `Orijinal dosyada ${origBlocks.length}, çeviri dosyasında ${transBlocks.length} altyazı bloğu bulunmaktadır.`;
            } else {
                banner.classList.add('hidden');
                banner.classList.remove('flex');
            }

            renderComparisonList();
            saveState();
        }

        function setFilter(filter) {
            activeFilter = filter;
            document.getElementById('tab-all').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition ' + (filter === 'all' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200');
            document.getElementById('tab-issues').className = 'px-3 py-1.5 rounded-md text-xs font-medium transition ' + (filter === 'issues' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200');
            renderComparisonList();
            saveState();
        }

        function renderComparisonList() {
            const container = document.getElementById('comparison-list');
            container.innerHTML = '';
            const maxLen = Math.max(origBlocks.length, transBlocks.length);
            const search = document.getElementById('search-input').value.toLowerCase().trim();

            let issueCount = 0;
            let totalRendered = 0;

            for (let i = 0; i < maxLen; i++) {
                const orig = origBlocks[i] || null;
                const trans = transBlocks[i] || null;
                const idx = i + 1;
                const blockIssues = [];

                if (orig && !orig.timeValid) blockIssues.push({ message: `Orijinal Zaman Format Hatası: ${orig.timeError}` });
                if (trans && !trans.timeValid) blockIssues.push({ message: `Çeviri Zaman Format Hatası: ${trans.timeError}` });
                if (orig && trans && orig.timeValid && trans.timeValid) {
                    if (orig.rawTime !== trans.rawTime) blockIssues.push({ message: `Zaman Damgası Uyuşmuyor!\n• Orijinal: ${orig.rawTime}\n• Çeviri: ${trans.rawTime}` });
                }
                if (!orig) blockIssues.push({ message: 'Orijinal dosyada mevcut değil (Eksik blok)!' });
                if (!trans) blockIssues.push({ message: 'Çeviri dosyasında mevcut değil (Eksik blok)!' });
                if (trans && trans.timeValid && i > 0 && transBlocks[i - 1] && transBlocks[i - 1].timeValid) {
                    if (trans.startMs < transBlocks[i - 1].endMs) blockIssues.push({ message: `Çakışan Zaman Damgası! Başlangıç zamanı bir önceki bloğun bitişinden önce geliyor.` });
                }

                const hasIssues = blockIssues.length > 0;
                if (hasIssues) issueCount++;

                const matchesSearch = !search ||
                    (orig && orig.text.toLowerCase().includes(search)) ||
                    (trans && trans.text.toLowerCase().includes(search)) ||
                    idx.toString() === search;

                if (!matchesSearch) continue;
                if (activeFilter === 'issues' && !hasIssues) continue;

                totalRendered++;

                const card = document.createElement('div');
                card.className = 'bg-slate-800 border ' + (hasIssues ? 'border-amber-800/80 bg-slate-800/90' : 'border-slate-700/80') + ' rounded-xl p-4 space-y-3 shadow-md fade-in';

                const statusBadge = hasIssues
                    ? `<span class="bg-amber-950/80 text-amber-300 text-xs px-2.5 py-1 rounded-md font-semibold border border-amber-700/60 flex items-center gap-1">⚠️ ${blockIssues.length} Sorun</span>`
                    : `<span class="bg-emerald-950/60 text-emerald-300 text-xs px-2.5 py-1 rounded-md font-semibold border border-emerald-800/50 flex items-center gap-1"><svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>Uyumlu</span>`;

                let issuesHTML = '';
                if (hasIssues) {
                    const listItems = blockIssues.map(iss => `<li class="flex items-start gap-1.5"><span class="text-amber-400 font-bold">•</span><span>${iss.message.replace(/\n/g, '<br>')}</span></li>`).join('');
                    issuesHTML = `<div class="bg-amber-950/40 border border-amber-800/60 rounded-lg p-3 text-xs text-amber-200/90 space-y-1 mt-2">` +
                        `<p class="font-semibold text-amber-300 flex items-center gap-1">⚠️ Tespit Edilen Uyarılar:</p>` +
                        `<ul class="space-y-1 pl-1 text-amber-200/90 font-mono text-[11px]">${listItems}</ul></div>`;
                }

                card.innerHTML =
                    `<div class="flex justify-between items-center border-b border-slate-700/60 pb-2">` +
                    `<span class="text-sm font-bold text-slate-300 bg-slate-900 px-2.5 py-1 rounded-md">#${idx}</span>` +
                    `<div>${statusBadge}</div>` +
                    `</div>` +
                    `<div class="grid md:grid-cols-2 gap-4">` +
                    `<div class="bg-slate-900/60 border border-slate-700/60 rounded-lg p-3 space-y-2">` +
                    `<div class="flex justify-between items-center text-xs border-b border-slate-800 pb-1.5"><span class="font-semibold text-indigo-400 uppercase">Orijinal</span>` +
                    (orig ? `<input type="text" class="font-mono text-indigo-300 bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/40 text-[11px] w-[230px] text-center focus:outline-none focus:border-indigo-400 transition-colors" value="${orig.rawTime}" onchange="updateBlock('orig', ${i}, 'time', this.value)">` : `<span class="font-mono text-slate-500 bg-slate-900 px-2 py-0.5 rounded border border-slate-800 text-[11px]">-</span>`) +
                    `</div>` +
                    (orig ? `<textarea class="w-full text-sm text-slate-200 bg-transparent border-none focus:outline-none focus:ring-0 resize-none font-sans min-h-[40px] p-0 m-0 overflow-hidden block" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px';" onchange="updateBlock('orig', ${i}, 'text', this.value)">${orig.text}</textarea>` : `<p class="text-sm text-slate-500 font-sans min-h-[40px]"><em>Blok yok</em></p>`) +
                    `</div>` +
                    `<div class="bg-slate-900/60 border border-slate-700/60 rounded-lg p-3 space-y-2">` +
                    `<div class="flex justify-between items-center text-xs border-b border-slate-800 pb-1.5"><span class="font-semibold text-violet-400 uppercase">Çeviri</span>` +
                    (trans ? `<input type="text" class="font-mono text-violet-300 bg-violet-950/60 px-2 py-0.5 rounded border border-violet-800/40 text-[11px] w-[230px] text-center focus:outline-none focus:border-violet-400 transition-colors" value="${trans.rawTime}" onchange="updateBlock('trans', ${i}, 'time', this.value)">` : `<span class="font-mono text-slate-500 bg-slate-900 px-2 py-0.5 rounded border border-slate-800 text-[11px]">-</span>`) +
                    `</div>` +
                    (trans ? `<textarea class="w-full text-sm text-slate-200 bg-transparent border-none focus:outline-none focus:ring-0 resize-none font-sans min-h-[40px] p-0 m-0 overflow-hidden block" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px';" onchange="updateBlock('trans', ${i}, 'text', this.value)">${trans.text}</textarea>` : `<p class="text-sm text-slate-500 font-sans min-h-[40px]"><em>Blok yok</em></p>`) +
                    `</div>` +
                    `</div>` + issuesHTML;

                container.appendChild(card);

                // Textarea height auto-adjust
                setTimeout(() => {
                    const textareas = card.querySelectorAll('textarea');
                    textareas.forEach(ta => {
                        ta.style.height = '';
                        ta.style.height = ta.scrollHeight + 'px';
                    });
                }, 0);
            }

            document.getElementById('count-all').textContent = maxLen;
            document.getElementById('count-issues').textContent = issueCount;
            document.getElementById('issue-count').textContent = issueCount;

            if (issueCount > 0) document.getElementById('issue-badge-summary').className = 'bg-amber-950/60 border border-amber-800 px-3 py-1.5 rounded-lg text-amber-200 font-semibold flex items-center gap-1';
            else document.getElementById('issue-badge-summary').className = 'bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 flex items-center gap-1';

            if (totalRendered === 0) container.innerHTML = `<div class="bg-slate-800/40 border border-slate-700 rounded-xl p-8 text-center text-slate-400 text-sm">Gösterilecek altyazı bloğu bulunamadı.</div>`;
        }

        // ── STATE PERSISTENCE ─────────────────────────────────────────────
        // Save files to the shared fileStore (same key as index.html)
        async function saveSharedFileStore() {
            await setStorageItem('fileStore', fileStore);
        }

        // Save compare-specific state (selections, filter) separately
        async function saveCompareState() {
            await setStorageItem('collapsedFolders', Array.from(collapsedFolders));
            await setStorageItem('compareApp2', {
                origFileKey,
                transFileKey,
                activeFilter,
                comparisonActive
            });
        }

        // Legacy alias so existing calls work
        async function saveState() {
            await saveSharedFileStore();
            await saveCompareState();
        }

        async function loadState() {
            // Load shared file store (same as index.html)
            const sharedStore = await getStorageItem('fileStore');
            if (sharedStore && Object.keys(sharedStore).length > 0) {
                // Ensure each entry has a `content` field for SRT parsing
                Object.keys(sharedStore).forEach(key => {
                    const entry = sharedStore[key];
                    if (!entry.content && entry.subtitles && entry.subtitles.length > 0) {
                        // Reconstruct raw SRT content from subtitles for compare parsing
                        entry.content = entry.subtitles.map((s, i) =>
                            `${i + 1}\n${s.time}\n${s.text}`
                        ).join('\n\n');
                    }
                });
                fileStore = sharedStore;
            }

            // Load compare-specific state
            const compareState = await getStorageItem('compareApp2');
            const storedCollapsed = await getStorageItem('collapsedFolders');

            if (storedCollapsed && Array.isArray(storedCollapsed)) {
                collapsedFolders = new Set(storedCollapsed);
            } else if (compareState && compareState.collapsedFolders) {
                collapsedFolders = new Set(compareState.collapsedFolders);
            }

            if (compareState) {
                if (compareState.activeFilter) activeFilter = compareState.activeFilter;

                if (compareState.origFileKey && fileStore[compareState.origFileKey]) setOriginal(compareState.origFileKey);
                if (compareState.transFileKey && fileStore[compareState.transFileKey]) setTranslated(compareState.transFileKey);

                if (compareState.comparisonActive && origFileKey && transFileKey) checkAndRenderComparison();
            }

            renderFileList();
        }

        function updateBlock(type, index, field, value) {
            const blocks = type === 'orig' ? origBlocks : transBlocks;
            const fileKey = type === 'orig' ? origFileKey : transFileKey;

            if (!blocks[index]) return;

            if (field === 'time') {
                blocks[index].rawTime = value;
                const parsed = parseTimeRange(value);
                blocks[index].startMs = parsed.startMs;
                blocks[index].endMs = parsed.endMs;
                blocks[index].timeValid = parsed.valid;
                blocks[index].timeError = parsed.error;
            } else if (field === 'text') {
                blocks[index].text = value;
            }

            if (fileKey && fileStore[fileKey]) {
                const newContent = blocks.map(b => `${b.index}\n${b.rawTime}\n${b.text}`).join('\n\n');
                fileStore[fileKey].content = newContent;
                fileStore[fileKey].subtitles = parseSubtitlesForEditor(newContent);
            }

            saveState();
            checkAndRenderComparison();
        }

        window.addEventListener('DOMContentLoaded', loadState);

        window.addEventListener('storage_sync', async function (e) {
            if (e.detail.key === 'fileStore') {
                const newStore = await getStorageItem('fileStore');
                if (newStore) {
                    fileStore = newStore;
                    renderFileList();
                    checkAndRenderComparison();
                }
            }
        });
    </script>
